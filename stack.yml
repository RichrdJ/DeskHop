# DeskHop - self-hosted remote support
#
# Geen variabelen nodig: deploy deze stack zoals hij is en open daarna
#   http://<server>:21114/admin   -> installatiewizard (beheerder, URL, serveradres)
#
#   /        publieke downloadpagina voor klanten
#   /admin   beheerconsole
#
# Poorten (geen 80/443 nodig):
#   21114/tcp  portaal + console + API
#   21115/tcp  ID-server (NAT-test)
#   21116/tcp  ID-server
#   21116/udp  ID-server
#   21117/tcp  relay-server

services:
  id-server:
    image: ghcr.io/richrdj/deskhop-server:latest
    command: hbbs
    volumes:
      - server-data:/root
    ports:
      - { target: 21115, published: 21115, protocol: tcp, mode: host }
      - { target: 21116, published: 21116, protocol: tcp, mode: host }
      - { target: 21116, published: 21116, protocol: udp, mode: host }
    environment:
      - ENCRYPTED_ONLY=1
    depends_on:
      - relay-server
    restart: unless-stopped
    deploy:
      restart_policy: { condition: any }

  relay-server:
    image: ghcr.io/richrdj/deskhop-server:latest
    command: hbbr
    volumes:
      - server-data:/root
    ports:
      - { target: 21117, published: 21117, protocol: tcp, mode: host }
    environment:
      - ENCRYPTED_ONLY=1
    restart: unless-stopped
    deploy:
      restart_policy: { condition: any }

  console:
    image: ghcr.io/richrdj/deskhop:latest
    volumes:
      - console-data:/data                  # database, instellingen, installers, certificaat
      - server-data:/server-data:ro         # leest de publieke key van de ID-server
    ports:
      - { target: 21114, published: 21114, protocol: tcp, mode: host }
    restart: unless-stopped
    deploy:
      restart_policy: { condition: any }

  # Optioneel: Cloudflare Tunnel voor https://support.jouwdomein.nl zonder open poort 80/443.
  # Zet in Cloudflare Zero Trust de public hostname -> http://console:21114 en vul je token in.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run --token PLAK-HIER-JE-TUNNEL-TOKEN
  #   restart: unless-stopped
  #   deploy:
  #     restart_policy: { condition: any }

volumes:
  server-data:
  console-data:
